<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Cormorant";
    src: url("fonts/CormorantGaramond.ttf") format("truetype");
    font-weight: 300 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Jost";
    src: url("fonts/Jost-Regular.ttf") format("truetype");
    font-weight: 200 700;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0C0B09;
  }
  .frame {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0C0B09 url("plate.jpg") center 46% / cover no-repeat;
  }
  .veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 58% 72% at 50% 50%, rgba(12,11,9,0.72) 0%, rgba(12,11,9,0.34) 52%, rgba(12,11,9,0.48) 100%);
  }
  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .name {
    font-family: "Cormorant", "Times New Roman", serif;
    font-weight: 500;
    font-size: 124px;
    line-height: 0.8;
    letter-spacing: 0.16em;
    color: #F6F1E7;
    padding-left: 0.16em;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: #C4A265;
    margin: 26px 0 22px;
  }
  .sub {
    font-family: "Jost", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1;
    letter-spacing: 0.58em;
    color: #F6F1E7;
    padding-left: 0.58em;
  }
  .tag {
    margin-top: 30px;
    font-family: "Jost", "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1;
    letter-spacing: 0.38em;
    color: #C4A265;
    padding-left: 0.38em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="veil"></div>
    <div class="lockup">
      <div class="name">ICLAX</div>
      <div class="rule"></div>
      <div class="sub">DIGITAL</div>
      <div class="tag">INNOVATING YOUR DIGITAL GROWTH</div>
    </div>
  </div>
</body>
</html>
